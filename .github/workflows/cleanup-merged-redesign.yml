name: One time branch cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove merged redesign branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = "redesign/meme-is-mine-v1";
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`
              });
              core.info(`Deleted merged branch: ${branch}`);
            } catch (error) {
              if (error.status === 404) {
                core.info(`Branch already absent: ${branch}`);
              } else {
                throw error;
              }
            }
