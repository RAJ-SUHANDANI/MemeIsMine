name: Build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, redesign, "redesign/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Validate catalog crawler syntax
        run: node --check scripts/sync-indian-meme-templates.mjs && node --check scripts/sync-indian-video-templates.mjs && node --check scripts/sync-open-templates.mjs
      - name: Lint application
        run: npm run lint
      - name: Typecheck application
        run: npm run typecheck
      - name: Build application
        run: npm run build
