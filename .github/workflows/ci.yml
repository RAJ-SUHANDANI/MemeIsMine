name: Build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "redesign/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
