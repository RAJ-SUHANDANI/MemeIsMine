name: Build check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, redesign, "redesign/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Validate catalog crawler syntax
        run: node --check scripts/sync-indian-meme-templates.mjs && node --check scripts/sync-indian-video-templates.mjs && node --check scripts/sync-open-templates.mjs
      - name: Lint application
        run: npm run lint
      - name: Verify first-party SQLite authentication
        run: npm run test:auth
      - name: Typecheck application
        run: npm run typecheck
      - name: Build application
        run: npm run build
      - name: Test production routes and APIs
        env:
          MIM_DATABASE_PATH: /tmp/mim-ci-accounts.sqlite
          MIM_AUTH_SECRET: ci-test-very-long-unpredictable-placeholder-only-not-for-production-2026
        run: |
          npm run start -- -p 3001 > /tmp/mim-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:3001/ > /dev/null; then break; fi
            sleep 2
          done
          npm run qa:smoke
