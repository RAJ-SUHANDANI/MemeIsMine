name: Mobile TypeScript Check

on:
  push:
    branches: [app]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-typecheck.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-typecheck.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo dependency compatibility
        run: npx expo install --check
      - name: TypeScript validation
        run: npm run typecheck
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Bundle Android JavaScript
        run: npx expo export --platform android --output-dir /tmp/memeismine-android-export
      - name: Bundle iOS JavaScript
        run: npx expo export --platform ios --output-dir /tmp/memeismine-ios-export
      - name: Validate Android native prebuild
        run: npx expo prebuild --clean --platform android --no-install
      - name: Validate iOS native prebuild
        run: npx expo prebuild --clean --platform ios --no-install
