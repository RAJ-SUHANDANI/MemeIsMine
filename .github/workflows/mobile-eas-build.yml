name: Native Mobile Build

on:
  push:
    branches: [app]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: EAS build profile
        required: true
        type: choice
        options:
          - preview
          - production

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[native-build'))
    name: EAS build · ${{ inputs.profile || 'preview' }} / ${{ inputs.platform || 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out app source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Validate EAS configuration
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add EXPO_TOKEN as a GitHub Actions secret."
            exit 1
          fi
      - name: Resolve build target
        id: target
        env:
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_PROFILE: ${{ inputs.profile }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          platform="${INPUT_PLATFORM:-all}"
          profile="${INPUT_PROFILE:-preview}"
          if [[ "$COMMIT_MESSAGE" =~ \[native-build:(android|ios|all):(preview|production)\] ]]; then
            platform="${BASH_REMATCH[1]}"
            profile="${BASH_REMATCH[2]}"
          fi
          echo "platform=$platform" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Expo dependencies
        run: npx expo install --check
      - name: Run Expo Doctor
        run: npx expo-doctor
      - name: Build native app with EAS
        env:
          BUILD_PLATFORM: ${{ steps.target.outputs.platform }}
          BUILD_PROFILE: ${{ steps.target.outputs.profile }}
        run: npx eas-cli@latest build --platform "$BUILD_PLATFORM" --profile "$BUILD_PROFILE" --non-interactive --message "GitHub Actions run $GITHUB_RUN_NUMBER"
