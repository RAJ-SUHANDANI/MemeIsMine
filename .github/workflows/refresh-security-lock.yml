name: Refresh dependency lock after security patch
on:
  push:
    branches: [redesign]
    paths:
      - .github/workflows/refresh-security-lock.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/redesign'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve patched dependencies and integrity hashes
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-exact
      - name: Commit regenerated lock to redesign only
        run: |
          git config user.name "mim-security-ci"
          git config user.email "security-ci@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Resolve patched Next.js and React lockfile"
            git push origin HEAD:redesign
          fi
