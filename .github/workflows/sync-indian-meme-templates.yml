name: Sync Indian meme template catalog

on:
  push:
    branches: [main]
    paths:
      - "scripts/sync-indian-meme-templates.mjs"
      - "scripts/sync-indian-video-templates.mjs"
      - "scripts/sync-open-templates.mjs"
      - ".github/workflows/sync-indian-meme-templates.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"
    - cron: "23 3 * * 0,2-6"

permissions:
  contents: write

concurrency:
  group: sync-indian-meme-template-catalog
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install catalog dependencies
        run: npm ci
      - name: Sync Imgflip and Memegen templates
        run: node scripts/sync-open-templates.mjs
      - name: Collect animated video templates
        run: node scripts/sync-indian-video-templates.mjs
      - name: Collect legacy still image templates
        if: github.event_name != 'schedule' || github.event.schedule == '23 3 * * 1'
        run: node scripts/sync-indian-meme-templates.mjs
      - name: Commit updated catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/indian-meme-templates.json src/data/indian-video-templates.json src/data/open-templates.json
          if git diff --cached --quiet; then
            echo "Template catalogs have no changes."
          else
            git commit -m "Update Indian meme template catalogs"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
