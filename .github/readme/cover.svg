  <text x="233" y="80" fill="#766f63" font-family="'Courier New',monospace" font-size="14" font-weight="700" letter-spacing="2.5">THE REACTION DEPARTMENT</text>
  <circle cx="1087" cy="76" r="5" fill="#db4b2c"/>
  <text x="1101" y="81" fill="#161715" font-family="'Courier New',monospace" font-size="14" font-weight="700" letter-spacing="1.8">FREE TO USE  /  2026</text>

  <text x="70" y="261" fill="#161715" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="151" font-weight="900" letter-spacing="-11">MEME</text>
  <text x="70" y="402" fill="#161715" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="146" font-weight="900" letter-spacing="-10">IS MINE<tspan fill="#db4b2c">.</tspan></text>

  <path d="M72 427Q360 419 653 424" fill="none" stroke="#db4b2c" stroke-width="4" stroke-linecap="round"/>
