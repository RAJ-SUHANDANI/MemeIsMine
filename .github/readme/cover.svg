<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Meme Is Mine — Make some noise</title>
  <desc id="desc">An editorial cream, charcoal and burnt-orange cover with bold Meme Is Mine lettering, a drawn reaction card, and a banner reading Your Memes, Your Rules.</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.85" fill="#cbbfae" opacity=".58"/>
