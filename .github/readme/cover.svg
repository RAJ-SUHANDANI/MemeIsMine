  <text x="617" y="598" fill="#fff8ec" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="19" font-weight="900" letter-spacing="3">SAME INTERNET. DIFFERENT PUNCHLINE.</text>
